<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUEST COUNTER - DRAGON STYLE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    :root {
      --dq-bg: #000000;
      --dq-window-bg: #000000;
      --dq-border: #ffffff;
      --dq-text: #ffffff;
      --dq-yellow: #facc15;
      --dq-green: #4ade80;
      --dq-red: #ef4444;
      --dq-gray: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DotGothic16', monospace;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--dq-bg);
      color: var(--dq-text);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
      background-image: 
        radial-gradient(#111827 1px, transparent 0);
      background-size: 8px 8px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    /* DQ Window Style Border */
    .dq-window {
      background: var(--dq-window-bg);
      border: 4px solid var(--dq-border);
      border-radius: 6px;
      box-shadow: 0 0 0 2px #000000, inset 0 0 0 2px #000000;
      padding: 16px;
      position: relative;
    }

    /* Total Score Box */
    .status-window {
      text-align: center;
    }

    .status-header {
      font-family: 'Press Start 2P', 'DotGothic16', monospace;
      font-size: 0.85rem;
      color: var(--dq-yellow);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .score-container {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
    }

    .total-pt {
      font-family: 'Press Start 2P', monospace;
      font-size: 2.8rem;
      color: var(--dq-yellow);
      text-shadow: 3px 3px 0px #78350f;
    }

    .unit {
      font-size: 1.2rem;
      color: var(--dq-text);
    }

    /* Chart Section */
    .chart-title {
      font-size: 1rem;
      color: var(--dq-yellow);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chart-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chart-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chart-label-group {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .chart-bar-bg {
      background: #1f2937;
      border: 2px solid var(--dq-border);
      height: 18px;
      position: relative;
      overflow: hidden;
    }

    .chart-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #16a34a, var(--dq-green));
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Quest List Section */
    .section-title {
      font-size: 1.05rem;
      color: var(--dq-yellow);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .add-task-toggle {
      background: var(--dq-window-bg);
      color: var(--dq-yellow);
      border: 2px solid var(--dq-border);
      padding: 4px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .add-task-toggle:active {
      background: var(--dq-yellow);
      color: #000;
    }

    /* Add Form */
    .add-form {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px dashed var(--dq-border);
    }

    .add-form.open {
      display: flex;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .dq-input {
      background: #000;
      color: #fff;
      border: 2px solid var(--dq-border);
      padding: 8px;
      font-size: 0.95rem;
      outline: none;
      width: 100%;
    }

    .dq-input:focus {
      border-color: var(--dq-yellow);
    }

    .save-btn {
      background: var(--dq-yellow);
      color: #000;
      border: 2px solid var(--dq-border);
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Task List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000;
      border: 2px solid var(--dq-border);
      padding: 10px 12px;
      position: relative;
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .task-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dq-cursor {
      color: var(--dq-yellow);
      font-size: 0.8rem;
    }

    .task-name {
      font-size: 1.05rem;
      color: #fff;
    }

    .task-rule {
      font-size: 0.8rem;
      color: var(--dq-gray);
    }

    .task-count {
      font-size: 0.85rem;
      color: var(--dq-green);
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-add {
      background: #000;
      color: var(--dq-yellow);
      border: 2px solid var(--dq-yellow);
      padding: 8px 12px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-add:active {
      background: var(--dq-yellow);
      color: #000;
      transform: scale(0.95);
    }

    .btn-delete {
      background: transparent;
      color: var(--dq-red);
      border: 1px solid var(--dq-red);
      padding: 6px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .btn-delete:hover {
      background: var(--dq-red);
      color: #fff;
    }

    /* Activity Log List with Delete */
    .log-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      padding-bottom: 4px;
      border-bottom: 1px dashed #333;
    }

    .log-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .log-del-btn {
      background: none;
      border: none;
      color: var(--dq-red);
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* EXP Floating Banner Effect */
    .exp-popup {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: rgba(0, 0, 0, 0.95);
      border: 4px solid var(--dq-yellow);
      padding: 16px 28px;
      color: var(--dq-yellow);
      font-size: 1.5rem;
      font-family: 'Press Start 2P', 'DotGothic16', monospace;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      z-index: 100;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .exp-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Status Window (Total Points) -->
  <div class="dq-window status-window">
    <div class="status-header">▶ けいけんち（TOTAL EXP）</div>
    <div class="score-container">
      <span class="total-pt" id="total-pt">0</span>
      <span class="unit">EXP</span>
    </div>
  </div>

  <!-- Chart Window -->
  <div class="dq-window">
    <div class="chart-title">▶ くえすと・しんちょうど（グラフ）</div>
    <div class="chart-container" id="chart-container"></div>
  </div>

  <!-- Task Control Window -->
  <div class="dq-window">
    <div class="section-title">
      <span>▶ くえすと・いちらん</span>
      <button class="add-task-toggle" onclick="toggleAddForm()">＋ ついか</button>
    </div>

    <!-- Dynamic Add Form -->
    <div class="add-form" id="add-form">
      <div class="input-group">
        <input type="text" id="new-name" class="dq-input" placeholder="項目名 (例: 早稲田日本史)" />
      </div>
      <div class="input-group">
        <input type="text" id="new-unit" class="dq-input" placeholder="単位/ルール (例: 10問)" />
        <input type="number" id="new-pt" class="dq-input" style="width: 90px;" placeholder="獲得pt" value="1" min="1" />
      </div>
      <button class="save-btn" onclick="addNewTask()">＋ くえすとをついか</button>
    </div>

    <!-- Task List -->
    <div class="task-list" id="task-list"></div>
  </div>

  <!-- Log Window -->
  <div class="dq-window">
    <div class="section-title">
      <span>▶ ぼうけんのきろく（りれき）</span>
      <button class="btn-delete" onclick="clearAllData()">ぜんぶけす</button>
    </div>
    <ul class="log-list" id="log-list"></ul>
  </div>

</div>

<!-- Effect Popup -->
<div class="exp-popup" id="exp-popup">
  <div>★ EXP GET! ★</div>
  <div id="exp-popup-val" style="font-size: 1.2rem; margin-top: 6px; color: #fff;">+1 EXP</div>
</div>

<script>
  // Default Tasks
  const DEFAULT_TASKS = [
    { id: 't_1', name: '英語長文', unit: '1題 完了', pt: 1 },
    { id: 't_2', name: '現代文', unit: '1題 完了', pt: 1 },
    { id: 't_3', name: '古文', unit: '1題 完了', pt: 1 },
    { id: 't_4', name: '英単語', unit: '50個 確認', pt: 1 },
    { id: 't_5', name: '問題集', unit: '10問 完了', pt: 1 }
  ];

  // Application State
  let state = JSON.parse(localStorage.getItem('dq_study_tracker_data')) || {
    totalPt: 0,
    tasks: DEFAULT_TASKS,
    counts: { t_1: 0, t_2: 0, t_3: 0, t_4: 0, t_5: 0 },
    logs: []
  };

  function saveData() {
    localStorage.setItem('dq_study_tracker_data', JSON.stringify(state));
  }

  function render() {
    // 1. Total EXP
    document.getElementById('total-pt').textContent = state.totalPt;

    // 2. Render Task Cards
    const taskListEl = document.getElementById('task-list');
    taskListEl.innerHTML = '';

    state.tasks.forEach(task => {
      const count = state.counts[task.id] || 0;
      const card = document.createElement('div');
      card.className = 'task-card';
      card.innerHTML = `
        <div class="task-info">
          <div class="task-name-row">
            <span class="dq-cursor">▶</span>
            <span class="task-name">${task.name}</span>
          </div>
          <div class="task-rule">たんい: ${task.unit} (+${task.pt}EXP)</div>
          <div class="task-count">たっせい: ${count} かい</div>
        </div>
        <div class="action-group">
          <button class="btn-add" onclick="addPt('${task.id}')">＋${task.pt} EXP</button>
          <button class="btn-delete" onclick="deleteTask('${task.id}')">さくじょ</button>
        </div>
      `;
      taskListEl.appendChild(card);
    });

    // 3. Render Bar Chart
    const chartContainerEl = document.getElementById('chart-container');
    chartContainerEl.innerHTML = '';

    let maxPt = 0;
    state.tasks.forEach(task => {
      const taskTotal = (state.counts[task.id] || 0) * task.pt;
      if (taskTotal > maxPt) maxPt = taskTotal;
    });

    state.tasks.forEach(task => {
      const taskTotalPt = (state.counts[task.id] || 0) * task.pt;
      const percent = maxPt > 0 ? (taskTotalPt / maxPt) * 100 : 0;

      const row = document.createElement('div');
      row.className = 'chart-row';
      row.innerHTML = `
        <div class="chart-label-group">
          <span>${task.name}</span>
          <span style="color: var(--dq-yellow);">${taskTotalPt} EXP</span>
        </div>
        <div class="chart-bar-bg">
          <div class="chart-bar-fill" style="width: ${percent}%;"></div>
        </div>
      `;
      chartContainerEl.appendChild(row);
    });

    // 4. Render Logs with Individual Delete
    const logListEl = document.getElementById('log-list');
    logListEl.innerHTML = '';

    if (state.logs.length === 0) {
      logListEl.innerHTML = '<li style="color: var(--dq-gray); text-align: center; font-size: 0.8rem;">きろくが ありません</li>';
    } else {
      state.logs.slice().reverse().forEach(log => {
        const li = document.createElement('li');
        li.className = 'log-item';
        li.innerHTML = `
          <div class="log-left">
            <button class="log-del-btn" onclick="deleteLog('${log.logId}')">✕</button>
            <span>${log.taskName} (+${log.pt}EXP)</span>
          </div>
          <span style="color: var(--dq-gray);">${log.date}</span>
        `;
        logListEl.appendChild(li);
      });
    }
  }

  // Add Points
  function addPt(taskId) {
    const task = state.tasks.find(t => t.id === taskId);
    if (!task) return;

    const gainPt = Number(task.pt) || 1;
    state.totalPt += gainPt;
    state.counts[taskId] = (state.counts[taskId] || 0) + 1;

    const now = new Date();
    const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

    const logId = 'log_' + Date.now();
    state.logs.push({
      logId: logId,
      taskId: taskId,
      taskName: task.name,
      pt: gainPt,
      date: dateStr
    });

    saveData();
    render();

    // DQ Effect
    showExpEffect(`+${gainPt} EXP!`);
  }

  // Effect Banner
  function showExpEffect(text) {
    const popup = document.getElementById('exp-popup');
    const valEl = document.getElementById('exp-popup-val');
    valEl.textContent = text;

    popup.classList.add('show');
    setTimeout(() => {
      popup.classList.remove('show');
    }, 900);
  }

  // Delete Individual Task
  function deleteTask(taskId) {
    if (confirm('このくえすとを さくじょしますか？')) {
      state.tasks = state.tasks.filter(t => t.id !== taskId);
      delete state.counts[taskId];
      saveData();
      render();
    }
  }

  // Delete Individual Log Item
  function deleteLog(logId) {
    const targetLog = state.logs.find(l => l.logId === logId);
    if (!targetLog) return;

    state.totalPt = Math.max(0, state.totalPt - targetLog.pt);
    if (state.counts[targetLog.taskId]) {
      state.counts[targetLog.taskId] = Math.max(0, state.counts[targetLog.taskId] - 1);
    }

    state.logs = state.logs.filter(l => l.logId !== logId);
    saveData();
    render();
  }

  // Add Custom Task
  function toggleAddForm() {
    const form = document.getElementById('add-form');
    form.classList.toggle('open');
  }

  function addNewTask() {
    const nameInput = document.getElementById('new-name');
    const unitInput = document.getElementById('new-unit');
    const ptInput = document.getElementById('new-pt');

    const name = nameInput.value.trim();
    const unit = unitInput.value.trim() || '1回';
    const pt = parseInt(ptInput.value, 10) || 1;

    if (!name) {
      alert('こうもくめいを にゅうりょくしてください');
      return;
    }

    const newId = 't_' + Date.now();
    state.tasks.push({
      id: newId,
      name: name,
      unit: unit,
      pt: pt
    });
    state.counts[newId] = 0;

    nameInput.value = '';
    unitInput.value = '';
    ptInput.value = '1';

    toggleAddForm();
    saveData();
    render();
  }

  // Clear All Data
  function clearAllData() {
    if (confirm('すべての ぼうけんのきろくを さくじょしますか？')) {
      state = {
        totalPt: 0,
        tasks: DEFAULT_TASKS,
        counts: { t_1: 0, t_2: 0, t_3: 0, t_4: 0, t_5: 0 },
        logs: []
      };
      saveData();
      render();
    }
  }

  // Initial Render
  render();
</script>

</body>
</html>
