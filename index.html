<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>早稲田攻略 戦略ナビゲーター</title>

  <!-- iOS PWA・アプリ表示設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --waseda-crimson: #660011;
      --waseda-crimson-light: #8b0018;
      --waseda-crimson-dark: #3f000a;
      --waseda-gold: #c5a059;
      --waseda-gold-light: #e8d3a7;
      
      --bg-color: #3f000a;
      --card-bg-solid: #50000d;
      --text-main: #ffffff;
      --text-sub: #d1c4c6;
      --border-color: rgba(197, 160, 89, 0.3);

      --subject-english: #d47a82;
      --subject-japanese: #d4a373;
      --subject-history: #81b29a;
      --subject-other: #a8dadc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(75px + env(safe-area-inset-bottom));
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%);
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--waseda-gold-light);
      font-family: "Georgia", serif;
    }

    .header-sub {
      font-size: 0.65rem;
      color: var(--text-sub);
      letter-spacing: 0.1em;
    }

    /* 🧠 【好奇心刺激】トリビアバナー */
    .trivia-box {
      background: rgba(197, 160, 89, 0.12);
      border: 1px dashed var(--waseda-gold);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: var(--waseda-gold-light);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .trivia-icon { font-size: 1.2rem; }

    /* ボトムナビゲーション */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(60px + env(safe-area-inset-bottom));
      background: rgba(40, 0, 6, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 8px;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.68rem;
      gap: 2px;
      cursor: pointer;
      width: 25%;
    }

    .nav-item.active {
      color: var(--waseda-gold);
      font-weight: bold;
    }

    .nav-icon { font-size: 1.2rem; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card-bg-solid);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .card h2 {
      font-size: 1rem;
      color: var(--waseda-gold);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    /* 🧠 ドパミン報酬系エリア */
    .hero-pt-box {
      text-align: center;
      padding: 16px 10px;
      background: radial-gradient(circle, rgba(197, 160, 89, 0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 20px;
      position: relative;
    }

    .rank-badge {
      font-size: 0.75rem;
      background: linear-gradient(90deg, var(--waseda-gold) 0%, #a37c3f 100%);
      color: #1a0004;
      padding: 2px 10px;
      border-radius: 10px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 6px;
    }

    .hero-pt-counter {
      font-size: 4rem;
      font-weight: 900;
      color: #ffffff;
      font-family: 'Times New Roman', serif;
      line-height: 1;
      text-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.4);
      display: inline-block;
    }

    .pt-pop {
      transform: scale(1.35);
      color: var(--waseda-gold);
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
    }

    /* 🧠 【収集欲求】バッジ一覧 */
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .badge-item {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      opacity: 0.35;
      filter: grayscale(100%);
      transition: all 0.3s ease;
    }

    .badge-item.unlocked {
      opacity: 1;
      filter: grayscale(0%);
      background: rgba(197, 160, 89, 0.15);
      border-color: var(--waseda-gold);
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.3);
    }

    .badge-icon { font-size: 1.6rem; display: block; margin-bottom: 2px; }
    .badge-name { font-size: 0.65rem; color: var(--waseda-gold-light); font-weight: bold; }
    .badge-req { font-size: 0.55rem; color: var(--text-sub); }

    /* 進捗メーター */
    .goal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .goal-card {
      background: rgba(0, 0, 0, 0.25);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }

    .progress-bar-bg {
      height: 7px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .fill-english { background: var(--subject-english); }
    .fill-japanese { background: var(--subject-japanese); }
    .fill-history { background: var(--subject-history); }
    .fill-other { background: var(--subject-other); }

    /* 入力フォーム */
    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      background: rgba(0,0,0,0.2);
      padding: 8px 12px;
      border-radius: 10px;
    }

    .date-row input[type="date"] {
      background: transparent;
      border: none;
      color: var(--waseda-gold-light);
      font-size: 0.85rem;
      font-weight: bold;
    }

    .selector-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.85rem;
      appearance: none;
      -webkit-appearance: none;
    }

    .action-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--waseda-gold) 0%, #a37c3f 100%);
      color: #1a0004;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(197, 160, 89, 0.4);
      transition: all 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .log-item {
      background: rgba(0,0,0,0.2);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      border-left: 3px solid var(--waseda-gold);
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff6b6b;
      font-size: 0.85rem;
      padding: 4px;
    }

    .chart-box {
      position: relative;
      height: 180px;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>WASEDA NAVI</h1>
      <div class="header-sub">早稲田大学合格 戦略統括ポータル</div>
    </div>
    <div style="font-size: 0.75rem; color: var(--waseda-gold);">
      <span id="header-date"></span>
    </div>
  </header>

  <!-- 🧠 好奇心を刺激する雑学・知識の隙間バナー -->
  <div class="trivia-box">
    <span class="trivia-icon">💡</span>
    <div id="trivia-text">早稲田の入試雑学をロード中...</div>
  </div>

  <!-- TAB 1: 記録 & ドパミン -->
  <div id="tab-study" class="tab-content active">
    
    <div class="card">
      <div class="hero-pt-box">
        <div class="rank-badge" id="user-rank">RANK: 早稲田の挑戦者</div><br>
        <div class="hero-pt-counter" id="hero-pt">0</div>
        <div style="font-size: 1rem; color: var(--waseda-gold); display: inline;">pt</div>
      </div>

      <!-- 進捗ゲージ -->
      <div class="goal-grid" style="margin-top: 12px;">
        <div class="goal-card">
          <div class="goal-header"><span>英語</span><span><b id="val-english">0</b>/5pt</span></div>
          <div class="progress-bar-bg"><div id="bar-english" class="progress-bar-fill fill-english"></div></div>
        </div>
        <div class="goal-card">
          <div class="goal-header"><span>国語</span><span><b id="val-japanese">0</b>/3pt</span></div>
          <div class="progress-bar-bg"><div id="bar-japanese" class="progress-bar-fill fill-japanese"></div></div>
        </div>
        <div class="goal-card">
          <div class="goal-header"><span>日本史</span><span><b id="val-history">0</b>/4pt</span></div>
          <div class="progress-bar-bg"><div id="bar-history" class="progress-bar-fill fill-history"></div></div>
        </div>
        <div class="goal-card">
          <div class="goal-header"><span>その他</span><span><b id="val-other">0</b>/2pt</span></div>
          <div class="progress-bar-bg"><div id="bar-other" class="progress-bar-fill fill-other"></div></div>
        </div>
      </div>
    </div>

    <!-- 爆速入力フォーム -->
    <div class="card">
      <h2>学習完了の記録</h2>
      <div class="date-row">
        <span style="font-size: 0.8rem; color: var(--text-sub);">記録日:</span>
        <input type="date" id="task-date" onchange="onDateChange()">
      </div>

      <div class="selector-grid">
        <select id="task-subject" onchange="updateSubOptions(); updateTaskOptions();">
          <option value="英語">英語</option>
          <option value="国語">国語</option>
          <option value="日本史">日本史</option>
          <option value="その他">その他</option>
        </select>
        <select id="task-sub"></select>
      </div>

      <div style="margin-bottom: 12px;">
        <select id="task-name-select" onchange="handleTaskSelectChange()"></select>
        <input type="text" id="task-name-custom" placeholder="教材名を入力" style="display:none; margin-top:8px;">
      </div>

      <button type="button" class="action-btn" onclick="addPointWithDopamine()">
        <span>⚔️</span> 1タスク完了 (+1pt)
      </button>
    </div>

    <div class="card">
      <h2>本日の実行ログ</h2>
      <div id="log-list"></div>
    </div>
  </div>

  <!-- TAB 2: 🧠 収集本能（コレクトバッジ） -->
  <div id="tab-badges" class="tab-content">
    <div class="card">
      <h2>早稲田栄誉バッジ集</h2>
      <p style="font-size: 0.75rem; color: var(--text-sub); margin-bottom: 10px;">ポイントを積み上げて伝統の称号をコンプリートせよ。</p>
      
      <div class="badge-grid" id="badge-container"></div>
    </div>
  </div>

  <!-- TAB 3: 分析・AI -->
  <div id="tab-analytics" class="tab-content">
    <div class="card">
      <h2>学習積み上げ推移</h2>
      <div class="chart-box">
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h2>軍師AIアドバイザー</h2>
      <textarea id="user-reflection" style="width:100%; height:70px; margin-bottom:10px;" placeholder="今日の感覚や疑問点を入力..."></textarea>
      <button type="button" class="action-btn" style="font-size:0.85rem; padding:12px;" onclick="requestAiAnalysis()">分析を実行</button>
      <div id="ai-output" style="margin-top:12px; font-size:0.8rem; color:var(--text-sub); white-space:pre-wrap;"></div>
    </div>
  </div>

  <!-- TAB 4: 設定 -->
  <div id="tab-settings" class="tab-content">
    <div class="card">
      <h2>設定</h2>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <label style="font-size:0.8rem;">Gemini API Key</label>
        <input type="password" id="api-key" placeholder="AIキーを入力" onchange="saveKey()">
        <button type="button" onclick="clearAllData()" style="background:#8b0000; color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; margin-top:20px;">
          ⚠️ 履歴を完全削除してやり直す
        </button>
      </div>
    </div>
  </div>

</div>

<!-- ボトムナビ -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('tab-study', this)">
    <span class="nav-icon">⚔️</span>
    <span>記録</span>
  </button>
  <button class="nav-item" onclick="switchTab('tab-badges', this)">
    <span class="nav-icon">🏆</span>
    <span>バッジ</span>
  </button>
  <button class="nav-item" onclick="switchTab('tab-analytics', this)">
    <span class="nav-icon">📊</span>
    <span>分析</span>
  </button>
  <button class="nav-item" onclick="switchTab('tab-settings', this)">
    <span class="nav-icon">⚙️</span>
    <span>設定</span>
  </button>
</nav>

<script>
  let studyLogs = [];
  
  const trivias = [
    "【日本史】早稲田創設者の大隈重信は、実は生涯で一度も自分の著書を書いたことがない（全て口述筆記）。",
    "【早稲田トリビア】大隈講堂の時計塔は「人生100年説」にちなんで100尺（約30m）の高さで作られた。",
    "【英語】早稲田の長文は「背景知識」があると爆速で読める。政治・経済のトレンドは必修概念！",
    "【脳科学】タスクを1つ終えるたびにポイントを押すと、脳内でドパミンが分泌され次のやる気を誘発する。"
  ];

  const badgesMaster = [
    { id: 1, name: "第一歩", icon: "🌱", req: 1 },
    { id: 2, name: "早稲田の灯", icon: "🏮", req: 10 },
    { id: 3, name: "大隈講堂", icon: "🏛️", req: 25 },
    { id: 4, name: "萬朝報", icon: "📰", req: 50 },
    { id: 5, name: "角帽の志", icon: "🎓", req: 80 },
    { id: 6, name: "臙脂の誇り", icon: "🚩", req: 120 },
    { id: 7, name: "大隈重信像", icon: "🗿", req: 170 },
    { id: 8, name: "早稲田王", icon: "👑", req: 230 }
  ];

  let savedTasks = {
    '英語': ['単熟語EX準1級', 'ポラリス1', '肘井の読解'],
    '国語': ['開発講座', '古文単語315', '岡本古文文法'],
    '日本史': ['東進一問一答', '実況中継1'],
    'その他': ['小論文演習']
  };
  
  let savedSubSubjects = {
    '英語': ['単語', '文法', '解釈', '長文'],
    '国語': ['現代文', '古文', '漢文'],
    '日本史': ['通史', '文化史', '史料', '一問一答'],
    'その他': ['その他']
  };

  let barChart = null;

  function getTodayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function init() {
    localStorage.removeItem('waseda_study_logs'); // 完全リセット保証
    
    document.getElementById('task-date').value = getTodayISO();
    document.getElementById('header-date').innerText = getTodayISO().replace(/-/g, '/');
    
    showRandomTrivia();
    updateSubOptions();
    updateTaskOptions();
    renderLogs();
    updateProgress();
    renderBadges();
    initChart();
  }

  function showRandomTrivia() {
    const idx = Math.floor(Math.random() * trivias.length);
    document.getElementById('trivia-text').innerText = trivias[idx];
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');

    if (tabId === 'tab-analytics') updateChart();
    if (tabId === 'tab-badges') renderBadges();
  }

  function onDateChange() {
    renderLogs();
    updateProgress();
  }

  function updateSubOptions() {
    const subject = document.getElementById('task-subject').value;
    const subSelect = document.getElementById('task-sub');
    subSelect.innerHTML = '';
    (savedSubSubjects[subject] || ['その他']).forEach(s => {
      subSelect.innerHTML += `<option value="${s}">${s}</option>`;
    });
  }

  function updateTaskOptions() {
    const subject = document.getElementById('task-subject').value;
    const select = document.getElementById('task-name-select');
    select.innerHTML = '';

    (savedTasks[subject] || []).forEach(t => {
      select.innerHTML += `<option value="${t}">${t}</option>`;
    });
    select.innerHTML += `<option value="__NEW__">＋ 新規教材を入力</option>`;
    
    handleTaskSelectChange();
  }

  function handleTaskSelectChange() {
    const select = document.getElementById('task-name-select');
    const customInput = document.getElementById('task-name-custom');
    customInput.style.display = (select.value === '__NEW__') ? 'block' : 'none';
  }

  function addPointWithDopamine() {
    const date = document.getElementById('task-date').value;
    const subject = document.getElementById('task-subject').value;
    const sub = document.getElementById('task-sub').value;
    
    const select = document.getElementById('task-name-select');
    const customInput = document.getElementById('task-name-custom');
    
    let taskName = select.value === '__NEW__' ? customInput.value.trim() : select.value;
    if (!taskName) return alert('教材名を入力してください');

    studyLogs.push({
      id: Date.now(),
      date,
      subject,
      subSubject: sub,
      name: taskName,
      amount: 1
    });

    renderLogs();
    updateProgress();
    renderBadges();
    showRandomTrivia();

    if (window.navigator && window.navigator.vibrate) {
      window.navigator.vibrate([20, 30, 20]);
    }

    const counter = document.getElementById('hero-pt');
    counter.classList.add('pt-pop');
    setTimeout(() => counter.classList.remove('pt-pop'), 200);

    confetti({
      particleCount: 45,
      spread: 60,
      origin: { y: 0.65 },
      colors: ['#c5a059', '#8b0018', '#ffffff']
    });
  }

  function deleteLog(id) {
    studyLogs = studyLogs.filter(l => l.id !== id);
    renderLogs();
    updateProgress();
    renderBadges();
  }

  function renderLogs() {
    const date = document.getElementById('task-date').value;
    const listEl = document.getElementById('log-list');
    listEl.innerHTML = '';

    const filtered = studyLogs.filter(l => l.date === date);
    if (filtered.length === 0) {
      listEl.innerHTML = `<div style="text-align:center; color:var(--text-sub); font-size:0.75rem; padding:8px;">記録はありません</div>`;
      return;
    }

    filtered.slice().reverse().forEach(l => {
      listEl.innerHTML += `
        <div class="log-item">
          <div>
            <b style="color:var(--waseda-gold);">[${l.subject}]</b> ${l.name}
            <span style="font-size:0.7rem; color:var(--text-sub);">(${l.subSubject})</span>
          </div>
          <div>
            <span style="font-weight:bold; color:var(--waseda-gold-light);">+1pt</span>
            <button class="delete-btn" onclick="deleteLog(${l.id})">✕</button>
          </div>
        </div>
      `;
    });
  }

  function updateProgress() {
    const date = document.getElementById('task-date').value;
    const targets = { '英語': 5, '国語': 3, '日本史': 4, 'その他': 2 };
    const keys = { '英語': 'english', '国語': 'japanese', '日本史': 'history', 'その他': 'other' };

    let dayPt = 0;

    Object.keys(targets).forEach(sub => {
      const targetVal = targets[sub];
      const count = studyLogs.filter(l => l.date === date && l.subject === sub).length;
      dayPt += count;

      const key = keys[sub];
      document.getElementById(`val-${key}`).innerText = count;
      const pct = Math.min(100, Math.round((count / targetVal) * 100));
      document.getElementById(`bar-${key}`).style.width = `${pct}%`;
    });

    document.getElementById('hero-pt').innerText = dayPt;

    // 🧠 ランク更新（通算ポイントで進化）
    const totalPt = studyLogs.length;
    let rank = "早稲田の挑戦者";
    if (totalPt >= 10) rank = "鍛錬の浪人";
    if (totalPt >= 30) rank = "早稲田の鬼";
    if (totalPt >= 80) rank = "キャンパスの覇者";
    document.getElementById('user-rank').innerText = `RANK: ${rank}`;
  }

  function renderBadges() {
    const totalPt = studyLogs.length;
    const container = document.getElementById('badge-container');
    container.innerHTML = '';

    badgesMaster.forEach(b => {
      const isUnlocked = totalPt >= b.req;
      container.innerHTML += `
        <div class="badge-item ${isUnlocked ? 'unlocked' : ''}">
          <span class="badge-icon">${b.icon}</span>
          <div class="badge-name">${b.name}</div>
          <div class="badge-req">${b.req}ptで解放</div>
        </div>
      `;
    });
  }

  function initChart() {
    const ctx = document.getElementById('barChart').getContext('2d');
    barChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: [],
        datasets: [{ label: '獲得pt', data: [], backgroundColor: '#c5a059' }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { ticks: { color: '#d1c4c6' }, grid: { display: false } },
          y: { ticks: { color: '#d1c4c6' }, beginAtZero: true }
        },
        plugins: { legend: { display: false } }
      }
    });
  }

  function updateChart() {
    const dates = [...new Set(studyLogs.map(l => l.date))].sort();
    const totals = dates.map(d => studyLogs.filter(l => l.date === d).length);

    barChart.data.labels = dates.map(d => d.substring(5));
    barChart.data.datasets[0].data = totals;
    barChart.update();
  }

  function saveKey() {
    localStorage.setItem('waseda_api_key', document.getElementById('api-key').value);
  }

  function clearAllData() {
    if (confirm('すべての履歴を初期化しますか？')) {
      studyLogs = [];
      renderLogs();
      updateProgress();
      renderBadges();
      alert('初期化が完了しました。');
    }
  }

  window.onload = init;
</script>

</body>
</html>
