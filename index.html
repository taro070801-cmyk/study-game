<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>早稲田攻略 戦略ナビゲーター</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      /* アースカラー & 自然（山・川・草原・大海）のテーマ */
      --bg-gradient: linear-gradient(135deg, #e4efe7 0%, #ceddcc 35%, #b3cdd1 70%, #9cb8c4 100%);
      --card-bg: rgba(247, 249, 246, 0.92);
      --text-main: #2d3732;
      --text-sub: #52635a;
      --primary: #3b604e;
      --border-color: #c4d1c7;
      
      /* 科目専用の優しい色合い */
      --subject-english: #f4c2c2;   /* 英語：柔らかいピンク */
      --subject-japanese: #f8cb9c;  /* 国語：柔らかいオレンジ */
      --subject-history: #b5dba4;   /* 日本史：柔らかい緑 */
      --subject-other: #d1d8e0;     /* その他 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 20px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ヘッダー＆API設定 */
    header {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 { font-size: 1.3rem; color: var(--primary); }

    .api-key-box {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: 5px;
    }

    .api-key-box input {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
    }

    /* タブ切り替え（タスク管理 vs AIパートナー） */
    .tab-menu {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--primary);
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-color);
    }

    /* フォーム・入力パーツ */
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 10px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .inline-inputs {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
    }

    button.primary-btn {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.primary-btn:hover { opacity: 0.9; }

    /* タスクリスト表示 */
    .task-list {
      list-style: none;
      margin-top: 10px;
    }

    .task-item {
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .bg-english { background-color: var(--subject-english); }
    .bg-japanese { background-color: var(--subject-japanese); }
    .bg-history { background-color: var(--subject-history); }
    .bg-other { background-color: var(--subject-other); }

    .delete-btn {
      background: #e2b3b3;
      color: #5c2222;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* グラフグリッド */
    .charts-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .charts-grid { grid-template-columns: 1fr; }
    }

    .chart-container {
      position: relative;
      height: 250px;
      width: 100%;
    }

    /* AIレポート表示領域 */
    .report-output {
      background: #ffffff;
      border-left: 4px solid var(--primary);
      padding: 15px;
      border-radius: 0 8px 8px 0;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.7;
      min-height: 150px;
    }

    .ai-advice-box {
      background: #eaf2ed;
      border: 1px solid #b8d4c2;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--primary);
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ヘッダー -->
  <header>
    <div>
      <h1>早稲田攻略 戦略ナビゲーター</h1>
      <p style="font-size: 0.8rem; color: var(--text-sub);">大自然テーマ / タスク自由単位・学習比率自動分析</p>
    </div>
    <div class="api-key-box">
      <label for="api-key" style="margin:0; font-size:0.8rem;">Gemini API Key:</label>
      <input type="password" id="api-key" placeholder="AIzaSy...">
    </div>
  </header>

  <!-- ページ切替タブ -->
  <div class="tab-menu">
    <button class="tab-btn active" onclick="switchTab('task-page')">1. タスク管理 & 日々の記録</button>
    <button class="tab-btn" onclick="switchTab('partner-page')">2. 専属AIパートナー & 分析</button>
  </div>

  <!-- PAGE 1: タスク管理 & 記録 -->
  <div id="task-page" class="tab-content active">
    <div class="card">
      <h2>新規学習タスクの登録 / 学習ログ追加</h2>
      <form id="task-form">
        <label for="task-subject">科目</label>
        <select id="task-subject" onchange="updateSubSubjectOptions()">
          <option value="英語">英語</option>
          <option value="国語">国語</option>
          <option value="日本史">日本史</option>
          <option value="その他">その他</option>
        </select>

        <label for="task-sub-subject">細分化（任意）</label>
        <select id="task-sub-subject">
          <option value="英語全体">英語全体</option>
          <option value="長文読解">長文読解</option>
          <option value="文法・単語">文法・単語</option>
        </select>

        <div class="inline-inputs" style="margin-top:10px;">
          <div>
            <label for="task-name">教材・タスク名</label>
            <input type="text" id="task-name" placeholder="例: システム英単語">
          </div>
          <div>
            <label for="task-amount">進めた量</label>
            <input type="number" id="task-amount" value="50" min="1">
          </div>
          <div>
            <label for="task-unit">単位（自由入力）</label>
            <input type="text" id="task-unit" placeholder="例: 単語, p, 題">
          </div>
        </div>

        <button type="button" class="primary-btn" onclick="addStudyLog()">学習実績を記録する</button>
      </form>
    </div>

    <!-- 登録済み記録一覧 -->
    <div class="card">
      <h2>学習ログ・編集一覧</h2>
      <ul id="log-list" class="task-list">
        <!-- JSで動的追加（初期はゼロ） -->
      </ul>
    </div>
  </div>

  <!-- PAGE 2: AIパートナー & 分析（グラフ） -->
  <div id="partner-page" class="tab-content">
    <div class="charts-grid">
      <!-- 棒グラフ：日々の推移（増減表示） -->
      <div class="card">
        <h2>日々の進捗推移（累積棒グラフ）</h2>
        <div class="chart-container">
          <canvas id="barChart"></canvas>
        </div>
      </div>

      <!-- 円グラフ：科目の偏り -->
      <div class="card">
        <h2>科目の学習割合</h2>
        <div class="chart-container">
          <canvas id="pieChart"></canvas>
        </div>
        <div id="ai-pie-advice" class="ai-advice-box">
          データが蓄積されると、ここにAIからの自動バランスアドバイスが表示されます。
        </div>
      </div>
    </div>

    <!-- AIパートナー対話＆深層分析 -->
    <div class="card">
      <h2>早稲田専門エリートAIパートナーによる個別分析</h2>
      <label for="user-reflection">本日の振り返り・相談・つまずき（自由記述）</label>
      <textarea id="user-reflection" placeholder="例: 日本史の文化史で知識が混同してしまう。選択肢の罠を見抜くコツを知りたい。"></textarea>

      <button type="button" class="primary-btn" id="ai-btn" onclick="requestAiAnalysis()">AIパートナーの多角分析を依頼する</button>

      <h3 style="font-size:0.95rem; color:var(--primary); margin-top:20px; margin-bottom:8px;">AIレポート出力結果</h3>
      <div id="ai-report-output" class="report-output">
AIキーを設定し、相談内容を入力してボタンを押すと、記録された学習データと科目の偏りを踏まえた個別アドバイスが生成されます。
      </div>
    </div>
  </div>
</div>

<script>
  // --- 状態管理データ（ゼロからスタート） ---
  let studyLogs = [];
  let barChart, pieChart;

  // --- タブ切替 ---
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');

    if (tabId === 'partner-page') {
      updateCharts();
      analyzeSubjectBalance();
    }
  }

  // --- 科目・サブカテゴリ連動 ---
  function updateSubSubjectOptions() {
    const subject = document.getElementById('task-subject').value;
    const subSelect = document.getElementById('task-sub-subject');
    subSelect.innerHTML = '';

    let options = [];
    if (subject === '英語') {
      options = ['英語全体', '長文読解', '文法・語法', '単語・熟語', '英作文'];
    } else if (subject === '国語') {
      options = ['国語全体', '現代文', '古文', '漢文'];
    } else if (subject === '日本史') {
      options = ['日本史全体', '通史・時代背景', '文化史', '史料問題'];
    } else {
      options = ['その他'];
    }

    options.forEach(opt => {
      const el = document.createElement('option');
      el.value = opt;
      el.innerText = opt;
      subSelect.appendChild(el);
    });
  }

  // --- 学習ログの追加 ---
  function addStudyLog() {
    const subject = document.getElementById('task-subject').value;
    const subSubject = document.getElementById('task-sub-subject').value;
    const name = document.getElementById('task-name').value || '学習';
    const amount = parseFloat(document.getElementById('task-amount').value) || 0;
    const unit = document.getElementById('task-unit').value || '項';

    if (amount <= 0) return alert('正しい量を入力してください。');

    const today = new Date();
    const dateStr = `${today.getMonth()+1}/${today.getDate()}`;

    const newLog = {
      id: Date.now(),
      date: dateStr,
      subject,
      subSubject,
      name,
      amount,
      unit
    };

    studyLogs.push(newLog);
    renderLogList();
    alert('学習ログを登録しました！');
  }

  // --- ログの削除・レンダリング ---
  function deleteLog(id) {
    studyLogs = studyLogs.filter(log => log.id !== id);
    renderLogList();
    updateCharts();
    analyzeSubjectBalance();
  }

  function renderLogList() {
    const listEl = document.getElementById('log-list');
    listEl.innerHTML = '';

    if (studyLogs.length === 0) {
      listEl.innerHTML = '<li style="text-align:center; color:var(--text-sub); padding:15px;">ログはまだありません（ゼロからスタート）</li>';
      return;
    }

    studyLogs.forEach(log => {
      let badgeClass = 'bg-other';
      if (log.subject === '英語') badgeClass = 'bg-english';
      if (log.subject === '国語') badgeClass = 'bg-japanese';
      if (log.subject === '日本史') badgeClass = 'bg-history';

      const li = document.createElement('li');
      li.className = 'task-item';
      li.innerHTML = `
        <div class="task-info">
          <span class="badge ${badgeClass}">${log.subject} (${log.subSubject})</span>
          <strong>${log.name}</strong>
          <span>${log.amount} ${log.unit} (${log.date})</span>
        </div>
        <button class="delete-btn" onclick="deleteLog(${log.id})">削除</button>
      `;
      listEl.appendChild(li);
    });
  }

  // --- Chart.js グラフ更新（アニメーション＆各科目指定色） ---
  function initCharts() {
    // 棒グラフ
    const ctxBar = document.getElementById('barChart').getContext('2d');
    barChart = new Chart(ctxBar, {
      type: 'bar',
      data: {
        labels: [],
        datasets: [{
          label: '日々の累計進捗量',
          data: [],
          backgroundColor: '#3b604e',
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: {
          duration: 1200,
          easing: 'easeOutQuart'
        },
        scales: {
          y: { beginAtZero: true, grid: { color: '#dbe5dd' } },
          x: { grid: { display: false } }
        }
      }
    });

    // 円グラフ（科目比率）
    const ctxPie = document.getElementById('pieChart').getContext('2d');
    pieChart = new Chart(ctxPie, {
      type: 'doughnut',
      data: {
        labels: ['英語', '国語', '日本史', 'その他'],
        datasets: [{
          data: [0, 0, 0, 0],
          backgroundColor: ['#f4c2c2', '#f8cb9c', '#b5dba4', '#d1d8e0']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: {
          animateScale: true,
          animateRotate: true,
          duration: 1000
        }
      }
    });
  }

  function updateCharts() {
    // 日付別集計
    const dateMap = {};
    const subjectMap = { '英語': 0, '国語': 0, '日本史': 0, 'その他': 0 };

    studyLogs.forEach(log => {
      dateMap[log.date] = (dateMap[log.date] || 0) + log.amount;
      if (subjectMap[log.subject] !== undefined) {
        subjectMap[log.subject] += log.amount;
      } else {
        subjectMap['その他'] += log.amount;
      }
    });

    // 棒グラフ更新
    barChart.data.labels = Object.keys(dateMap);
    barChart.data.datasets[0].data = Object.values(dateMap);
    barChart.update();

    // 円グラフ更新
    pieChart.data.datasets[0].data = [
      subjectMap['英語'],
      subjectMap['国語'],
      subjectMap['日本史'],
      subjectMap['その他']
    ];
    pieChart.update();
  }

  // --- 科目バランス自動分析（ワンポイント表示） ---
  function analyzeSubjectBalance() {
    const adviceEl = document.getElementById('ai-pie-advice');
    const subjectMap = { '英語': 0, '国語': 0, '日本史': 0 };
    let total = 0;

    studyLogs.forEach(log => {
      if (subjectMap[log.subject] !== undefined) {
        subjectMap[log.subject] += log.amount;
        total += log.amount;
      }
    });

    if (total === 0) {
      adviceEl.innerText = "データが蓄積されると、ここにAIからの自動バランスアドバイスが表示されます。";
      return;
    }

    const engRatio = ((subjectMap['英語'] / total) * 100).toFixed(0);
    const jpnRatio = ((subjectMap['国語'] / total) * 100).toFixed(0);
    const hisRatio = ((subjectMap['日本史'] / total) * 100).toFixed(0);

    let advice = `【現在の学習比率】英語:${engRatio}% / 国語:${jpnRatio}% / 日本史:${hisRatio}%\n`;
    if (engRatio < 40) {
      advice += "💡 配点の高い『英語』の比率が低めです。配点比率に合わせたバランスを検討しましょう。";
    } else if (hisRatio < 20) {
      advice += "💡 『日本史』の積み上げがやや遅れています。知識整理のタスクを定期的に挟むと効果的です。";
    } else {
      advice += "✨ 非常に良好な科目バランスで学習が進んでいます！この調子で継続しましょう。";
    }

    adviceEl.innerText = advice;
  }

  // --- Gemini API 接続 & 深層アドバイス要請 ---
  async function requestAiAnalysis() {
    const apiKey = document.getElementById('api-key').value.trim();
    const reportBox = document.getElementById('ai-report-output');
    const reflection = document.getElementById('user-reflection').value;
    const btn = document.getElementById('ai-btn');

    if (!apiKey) return alert("Google Gemini API Key を入力してください。");
    if (studyLogs.length === 0 && !reflection) {
      return alert("学習ログを記録するか、振り返り内容を入力してください。");
    }

    btn.disabled = true;
    btn.innerText = "Geminiが多角的に分析中...";
    reportBox.innerText = "これまでの学習ログとバランスを照合し、早稲田合格に必要な指導文を構築中...";

    const logSummary = studyLogs.map(l => `- ${l.date}: ${l.subject}(${l.subSubject}) ${l.name} ${l.amount}${l.unit}`).join('\n');

    const systemInstruction = `
あなたは早稲田大学受験に特化した専属のエリートAIパートナーです。
受験生に対して、慰めではなく「思考の深さ」「自分にない多角的な視点」「出題者側のトラップ構造」を提示してください。

【出力構成】
1. 思考プロセスの弱点分析（なぜそのミスや伸び悩みが起きるのか）
2. エリートパートナーからの多面的アプローチ（自分では気づかない逆説的・俯瞰的な視点）
3. 明日からの具体的改善タスク方針
    `;

    const userPrompt = `
【現在の学習ログ一覧】
${logSummary || "（まだログなし）"}

【受験生本人の相談・振返り】
${reflection || "特に記載なし。ログ全体の傾向からアドバイスをお願いします。"}
    `;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: systemInstruction + "\n\n" + userPrompt }] }]
        })
      });

      const data = await response.json();
      if (data.candidates && data.candidates[0].content.parts[0].text) {
        reportBox.innerText = data.candidates[0].content.parts[0].text;
      } else {
        reportBox.innerText = "エラー: AIからのレスポンスを取得できませんでした。APIキーを確認してください。";
      }
    } catch (err) {
      console.error(err);
      reportBox.innerText = "通信エラーが発生しました。ネット環境またはAPIキーを確認してください。";
    } finally {
      btn.disabled = false;
      btn.innerText = "AIパートナーの多角分析を依頼する";
    }
  }

  // 初期化実行
  window.onload = function() {
    updateSubSubjectOptions();
    initCharts();
  };
</script>

</body>
</html>
