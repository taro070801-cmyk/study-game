<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>早稲田攻略 戦略ナビゲーター</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --waseda-crimson: #660011;
      --waseda-gold: #c5a059;
      --waseda-gold-light: #e8d3a7;
      
      --bg-color: #3f000a;
      --card-bg-solid: #50000d;
      --text-main: #ffffff;
      --text-sub: #d1c4c6;
      --border-color: rgba(197, 160, 89, 0.3);

      /* 指定の落ち着いたカラー定義 */
      --subject-english: #d47a82;  /* 落ち着いたピンク */
      --subject-japanese: #d4a373; /* 落ち着いたオレンジ */
      --subject-history: #81b29a;  /* 落ち着いた緑 */
      --subject-other: #8d99ae;    /* 落ち着いたグレー */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(75px + env(safe-area-inset-bottom));
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%);
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--waseda-gold-light);
      font-family: "Georgia", serif;
    }

    .trivia-box {
      background: rgba(197, 160, 89, 0.12);
      border: 1px dashed var(--waseda-gold);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: var(--waseda-gold-light);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(60px + env(safe-area-inset-bottom));
      background: rgba(40, 0, 6, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 8px;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.68rem;
      gap: 2px;
      cursor: pointer;
      width: 25%;
    }

    .nav-item.active { color: var(--waseda-gold); font-weight: bold; }
    .nav-icon { font-size: 1.2rem; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card-bg-solid);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .card h2 {
      font-size: 1rem;
      color: var(--waseda-gold);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    .hero-pt-box {
      text-align: center;
      padding: 16px 10px;
      background: radial-gradient(circle, rgba(197, 160, 89, 0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 20px;
    }

    .rank-badge {
      font-size: 0.75rem;
      background: linear-gradient(90deg, var(--waseda-gold) 0%, #a37c3f 100%);
      color: #1a0004;
      padding: 2px 10px;
      border-radius: 10px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 6px;
    }

    .hero-pt-counter {
      font-size: 4rem;
      font-weight: 900;
      color: #ffffff;
      font-family: 'Times New Roman', serif;
      line-height: 1;
      text-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.4);
      display: inline-block;
    }

    .pt-pop {
      transform: scale(1.35);
      color: var(--waseda-gold);
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .badge-item {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      opacity: 0.35;
      filter: grayscale(100%);
      transition: all 0.3s ease;
    }

    .badge-item.unlocked {
      opacity: 1;
      filter: grayscale(0%);
      background: rgba(197, 160, 89, 0.15);
      border-color: var(--waseda-gold);
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.3);
    }

    .badge-icon { font-size: 1.6rem; display: block; margin-bottom: 2px; }
    .badge-name { font-size: 0.65rem; color: var(--waseda-gold-light); font-weight: bold; }
    .badge-req { font-size: 0.55rem; color: var(--text-sub); }

    .goal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .goal-card {
      background: rgba(0, 0, 0, 0.25);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }

    .progress-bar-bg {
      height: 7px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .fill-english { background: var(--subject-english); }
    .fill-japanese { background: var(--subject-japanese); }
    .fill-history { background: var(--subject-history); }
    .fill-other { background: var(--subject-other); }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      background: rgba(0,0,0,0.2);
      padding: 8px 12px;
      border-radius: 10px;
    }

    .date-row input[type="date"] {
      background: transparent;
      border: none;
      color: var(--waseda-gold-light);
      font-size: 0.85rem;
      font-weight: bold;
    }

    .selector-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.85rem;
      appearance: none;
      -webkit-appearance: none;
    }

    .action-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--waseda-gold) 0%, #a37c3f 100%);
      color: #1a0004;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(197, 160, 89, 0.4);
      transition: all 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .action-btn:active { transform: scale(0.96); }

    .log-item {
      background: rgba(0,0,0,0.2);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff6b6b;
      font-size: 0.85rem;
      padding: 4px;
      cursor: pointer;
    }

    /* 2列グラフ配置用 */
    .pie-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .chart-box-pie {
      position: relative;
      height: 160px;
      width: 100%;
    }

    .chart-box-bar {
      position: relative;
      height: 200px;
      width: 100%;
    }

    .item-manage-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>WASEDA NAVI</h1>
      <div style="font-size:0.65rem; color:var(--text-sub);">早稲田大学合格 戦略統括ポータル</div>
    </div>
    <div style="font-size: 0.75rem; color: var(--waseda-gold);">
      <span id="header-date"></span>
    </div>
  </header>

  <div class="trivia-box">
    <span style="font-size: 1.2rem;">💡</span>
    <div id="trivia-text">早稲田の入試雑学をロード中...</div>
  </div>

  <!-- TAB 1: 記録 & ドパミン -->
  <div id="tab-study" class="tab-content active">
    
    <div class="card">
      <div class="hero-pt-box">
        <div class="rank-badge" id="user-rank">RANK: 早稲田の挑戦者</div><br>
        <div class="hero-pt-counter" id="hero-pt">0</div>
        <div style="font-size: 1rem; color: var(--waseda-gold); display: inline;">pt</div>
      </div>

      <div class="goal-grid" style="margin-top: 12px;">
        <div class="goal-card" style="border-left: 3px solid var(--subject-english);">
          <div class="goal-header"><span>英語</span><span><b id="val-english">0</b>/<span id="target-val-english">5</span>pt</span></div>
          <div class="progress-bar-bg"><div id="bar-english" class="progress-bar-fill fill-english"></div></div>
        </div>
        <div class="goal-card" style="border-left: 3px solid var(--subject-japanese);">
          <div class="goal-header"><span>国語</span><span><b id="val-japanese">0</b>/<span id="target-val-japanese">3</span>pt</span></div>
          <div class="progress-bar-bg"><div id="bar-japanese" class="progress-bar-fill fill-japanese"></div></div>
        </div>
        <div class="goal-card" style="border-left: 3px solid var(--subject-history);">
          <div class="goal-header"><span>日本史</span><span><b id="val-history">0</b>/<span id="target-val-history">4</span>pt</span></div>
          <div class="progress-bar-bg"><div id="bar-history" class="progress-bar-fill fill-history"></div></div>
        </div>
        <div class="goal-card" style="border-left: 3px solid var(--subject-other);">
          <div class="goal-header"><span>その他</span><span><b id="val-other">0</b>/<span id="target-val-other">2</span>pt</span></div>
          <div class="progress-bar-bg"><div id="bar-other" class="progress-bar-fill fill-other"></div></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>学習完了の記録</h2>
      <div class="date-row">
        <span style="font-size: 0.8rem; color: var(--text-sub);">記録日:</span>
        <input type="date" id="task-date" onchange="onDateChange()">
      </div>

      <div class="selector-grid">
        <select id="task-subject" onchange="updateSubOptions(); updateTaskOptions();">
          <option value="英語">英語</option>
          <option value="国語">国語</option>
          <option value="日本史">日本史</option>
          <option value="その他">その他</option>
        </select>
        <select id="task-sub"></select>
      </div>

      <div style="margin-bottom: 12px;">
        <select id="task-name-select" onchange="handleTaskSelectChange()"></select>
        <input type="text" id="task-name-custom" placeholder="新規教材名を入力" style="display:none; margin-top:8px;">
      </div>

      <button type="button" class="action-btn" onclick="addPointWithDopamine()">
        <span>⚔️</span> 1タスク完了 (+1pt)
      </button>
    </div>

    <div class="card">
      <h2>本日の実行ログ</h2>
      <div id="log-list"></div>
    </div>
  </div>

  <!-- TAB 2: 🏆 バッジ -->
  <div id="tab-badges" class="tab-content">
    <div class="card">
      <h2>早稲田栄誉バッジ集</h2>
      <p style="font-size: 0.75rem; color: var(--text-sub); margin-bottom: 10px;">ポイントを積み上げて伝統の称号をコンプリートせよ。</p>
      <div class="badge-grid" id="badge-container"></div>
    </div>
  </div>

  <!-- TAB 3: 📊 分析・円グラフ・積立グラフ -->
  <div id="tab-analytics" class="tab-content">
    
    <!-- 本日の学習内訳（円グラフ2種） -->
    <div class="card">
      <h2>本日の学習バランス</h2>
      <div class="pie-grid">
        <div>
          <div style="font-size:0.75rem; text-align:center; color:var(--waseda-gold-light); margin-bottom:4px;">全科目割合</div>
          <div class="chart-box-pie">
            <canvas id="subjectPieChart"></canvas>
          </div>
        </div>
        <div>
          <div style="font-size:0.75rem; text-align:center; color:var(--subject-japanese); margin-bottom:4px;">国語グループ内訳</div>
          <div class="chart-box-pie">
            <canvas id="japanesePieChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- 積み上げ推移グラフ -->
    <div class="card">
      <h2>科目別 積み上げ推移</h2>
      <div class="chart-box-bar">
        <canvas id="stackedBarChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h2>軍師AIアドバイザー</h2>
      <textarea id="user-reflection" style="width:100%; height:70px; margin-bottom:10px;" placeholder="今日の感覚や疑問点を入力..."></textarea>
      <button type="button" class="action-btn" style="font-size:0.85rem; padding:12px;" onclick="requestAiAnalysis()">分析を実行</button>
      <div id="ai-output" style="margin-top:12px; font-size:0.8rem; color:var(--text-sub); white-space:pre-wrap;"></div>
    </div>
  </div>

  <!-- TAB 4: ⚙️ 設定 & 項目削除・目標設定 -->
  <div id="tab-settings" class="tab-content">
    
    <!-- 目標設定カード -->
    <div class="card">
      <h2>1日の目標pt設定</h2>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:0.8rem;">
        <div>英語目標: <input type="number" id="target-input-english" value="5" min="1"></div>
        <div>国語目標: <input type="number" id="target-input-japanese" value="3" min="1"></div>
        <div>日本史目標: <input type="number" id="target-input-history" value="4" min="1"></div>
        <div>その他目標: <input type="number" id="target-input-other" value="2" min="1"></div>
      </div>
      <button type="button" class="action-btn" style="font-size:0.85rem; padding:10px; margin-top:12px;" onclick="saveTargets()">目標を変更保存</button>
    </div>

    <!-- 教材項目の管理・削除カード -->
    <div class="card">
      <h2>登録教材の削除・管理</h2>
      <div style="margin-bottom:10px;">
        <select id="manage-subject-select" onchange="renderItemManageList()">
          <option value="英語">英語の教材一覧</option>
          <option value="国語">国語の教材一覧</option>
          <option value="日本史">日本史の教材一覧</option>
          <option value="その他">その他の教材一覧</option>
        </select>
      </div>
      <div id="item-manage-list"></div>
    </div>

    <div class="card">
      <h2>システム設定</h2>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <label style="font-size:0.8rem;">Gemini API Key</label>
        <input type="password" id="api-key" placeholder="AIキーを入力" onchange="saveKey()">
        <button type="button" onclick="clearAllData()" style="background:#8b0000; color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; margin-top:20px;">
          ⚠️ データを完全初期化する
        </button>
      </div>
    </div>
  </div>

</div>

<!-- ボトムナビ -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('tab-study', this)">
    <span class="nav-icon">⚔️</span>
    <span>記録</span>
  </button>
  <button class="nav-item" onclick="switchTab('tab-badges', this)">
    <span class="nav-icon">🏆</span>
    <span>バッジ</span>
  </button>
  <button class="nav-item" onclick="switchTab('tab-analytics', this)">
    <span class="nav-icon">📊</span>
    <span>分析</span>
  </button>
  <button class="nav-item" onclick="switchTab('tab-settings', this)">
    <span class="nav-icon">⚙️</span>
    <span>設定</span>
  </button>
</nav>

<script>
  let studyLogs = [];
  
  let targetPoints = {
    '英語': 5,
    '国語': 3,
    '日本史': 4,
    'その他': 2
  };

  let savedTasks = {
    '英語': ['単熟語EX準1級', 'ポラリス1', '肘井の読解'],
    '国語': ['開発講座', '古文単語315', '岡本古文文法'],
    '日本史': ['東進一問一答', '実況中継1'],
    'その他': ['小論文演習']
  };
  
  const savedSubSubjects = {
    '英語': ['単語', '文法', '解釈', '長文'],
    '国語': ['現代文', '古文', '漢文'],
    '日本史': ['通史', '文化史', '史料', '一問一答'],
    'その他': ['その他']
  };

  const trivias = [
    "【日本史】早稲田創設者の大隈重信は、実は生涯で一度も自分の著書を書いたことがない（全て口述筆記）。",
    "【早稲田トリビア】大隈講堂の時計塔は「人生100年説」にちなんで100尺（約30m）の高さで作られた。",
    "【英語】早稲田の長文は「背景知識」があると爆速で読める。政治・経済のトレンドは必修概念！",
    "【脳科学】タスクを1つ終えるたびにポイントを押すと、脳内でドパミンが分泌され次のやる気を誘発する。"
  ];

  const badgesMaster = [
    { id: 1, name: "第一歩", icon: "🌱", req: 1 },
    { id: 2, name: "早稲田の灯", icon: "🏮", req: 10 },
    { id: 3, name: "大隈講堂", icon: "🏛️", req: 25 },
    { id: 4, name: "萬朝報", icon: "📰", req: 50 },
    { id: 5, name: "角帽の志", icon: "🎓", req: 80 },
    { id: 6, name: "臙脂の誇り", icon: "🚩", req: 120 },
    { id: 7, name: "大隈重信像", icon: "🗿", req: 170 },
    { id: 8, name: "早稲田王", icon: "👑", req: 230 }
  ];

  let subjectPieChart = null;
  let japanesePieChart = null;
  let stackedBarChart = null;

  function getTodayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function init() {
    localStorage.removeItem('waseda_study_logs');
    
    document.getElementById('task-date').value = getTodayISO();
    document.getElementById('header-date').innerText = getTodayISO().replace(/-/g, '/');
    
    showRandomTrivia();
    updateSubOptions();
    updateTaskOptions();
    renderLogs();
    updateProgress();
    renderBadges();
    renderItemManageList();
    initCharts();
  }

  function showRandomTrivia() {
    const idx = Math.floor(Math.random() * trivias.length);
    document.getElementById('trivia-text').innerText = trivias[idx];
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');

    if (tabId === 'tab-analytics') updateCharts();
    if (tabId === 'tab-badges') renderBadges();
    if (tabId === 'tab-settings') renderItemManageList();
  }

  function onDateChange() {
    renderLogs();
    updateProgress();
  }

  function updateSubOptions() {
    const subject = document.getElementById('task-subject').value;
    const subSelect = document.getElementById('task-sub');
    subSelect.innerHTML = '';
    (savedSubSubjects[subject] || ['その他']).forEach(s => {
      subSelect.innerHTML += `<option value="${s}">${s}</option>`;
    });
  }

  function updateTaskOptions() {
    const subject = document.getElementById('task-subject').value;
    const select = document.getElementById('task-name-select');
    select.innerHTML = '';

    (savedTasks[subject] || []).forEach(t => {
      select.innerHTML += `<option value="${t}">${t}</option>`;
    });
    select.innerHTML += `<option value="__NEW__">＋ 新規教材を入力</option>`;
    handleTaskSelectChange();
  }

  function handleTaskSelectChange() {
    const select = document.getElementById('task-name-select');
    const customInput = document.getElementById('task-name-custom');
    customInput.style.display = (select.value === '__NEW__') ? 'block' : 'none';
  }

  function addPointWithDopamine() {
    const date = document.getElementById('task-date').value;
    const subject = document.getElementById('task-subject').value;
    const sub = document.getElementById('task-sub').value;
    
    const select = document.getElementById('task-name-select');
    const customInput = document.getElementById('task-name-custom');
    
    let taskName = select.value === '__NEW__' ? customInput.value.trim() : select.value;
    if (!taskName) return alert('教材名を入力してください');

    if (select.value === '__NEW__' && !savedTasks[subject].includes(taskName)) {
      savedTasks[subject].push(taskName);
      updateTaskOptions();
    }

    studyLogs.push({
      id: Date.now(),
      date,
      subject,
      subSubject: sub,
      name: taskName,
      amount: 1
    });

    renderLogs();
    updateProgress();
    renderBadges();
    showRandomTrivia();

    if (window.navigator && window.navigator.vibrate) {
      window.navigator.vibrate([20, 30, 20]);
    }

    const counter = document.getElementById('hero-pt');
    counter.classList.add('pt-pop');
    setTimeout(() => counter.classList.remove('pt-pop'), 200);

    confetti({
      particleCount: 45,
      spread: 60,
      origin: { y: 0.65 },
      colors: ['#c5a059', '#8b0018', '#ffffff']
    });
  }

  function deleteLog(id) {
    studyLogs = studyLogs.filter(l => l.id !== id);
    renderLogs();
    updateProgress();
    renderBadges();
  }

  /* 項目（教材）削除機能 */
  function deleteMasterItem(subject, item) {
    savedTasks[subject] = savedTasks[subject].filter(i => i !== item);
    updateTaskOptions();
    renderItemManageList();
  }

  function renderItemManageList() {
    const subject = document.getElementById('manage-subject-select').value;
    const listEl = document.getElementById('item-manage-list');
    listEl.innerHTML = '';

    const items = savedTasks[subject] || [];
    if (items.length === 0) {
      listEl.innerHTML = `<div style="font-size:0.75rem; color:var(--text-sub);">登録項目はありません</div>`;
      return;
    }

    items.forEach(item => {
      listEl.innerHTML += `
        <div class="item-manage-row">
          <span>${item}</span>
          <button class="delete-btn" onclick="deleteMasterItem('${subject}', '${item}')">削除 ✕</button>
        </div>
      `;
    });
  }

  /* 目標値の変更保存 */
  function saveTargets() {
    targetPoints['英語'] = parseInt(document.getElementById('target-input-english').value) || 1;
    targetPoints['国語'] = parseInt(document.getElementById('target-input-japanese').value) || 1;
    targetPoints['日本史'] = parseInt(document.getElementById('target-input-history').value) || 1;
    targetPoints['その他'] = parseInt(document.getElementById('target-input-other').value) || 1;

    document.getElementById('target-val-english').innerText = targetPoints['英語'];
    document.getElementById('target-val-japanese').innerText = targetPoints['国語'];
    document.getElementById('target-val-history').innerText = targetPoints['日本史'];
    document.getElementById('target-val-other').innerText = targetPoints['その他'];

    updateProgress();
    alert('目標を更新しました');
  }

  function renderLogs() {
    const date = document.getElementById('task-date').value;
    const listEl = document.getElementById('log-list');
    listEl.innerHTML = '';

    const filtered = studyLogs.filter(l => l.date === date);
    if (filtered.length === 0) {
      listEl.innerHTML = `<div style="text-align:center; color:var(--text-sub); font-size:0.75rem; padding:8px;">記録はありません</div>`;
      return;
    }

    const colorMap = {
      '英語': 'var(--subject-english)',
      '国語': 'var(--subject-japanese)',
      '日本史': 'var(--subject-history)',
      'その他': 'var(--subject-other)'
    };

    filtered.slice().reverse().forEach(l => {
      listEl.innerHTML += `
        <div class="log-item" style="border-left: 3px solid ${colorMap[l.subject]};">
          <div>
            <b style="color:${colorMap[l.subject]};">[${l.subject}]</b> ${l.name}
            <span style="font-size:0.7rem; color:var(--text-sub);">(${l.subSubject})</span>
          </div>
          <div>
            <span style="font-weight:bold; color:var(--waseda-gold-light);">+1pt</span>
            <button class="delete-btn" onclick="deleteLog(${l.id})">✕</button>
          </div>
        </div>
      `;
    });
  }

  function updateProgress() {
    const date = document.getElementById('task-date').value;
    const keys = { '英語': 'english', '国語': 'japanese', '日本史': 'history', 'その他': 'other' };

    let dayPt = 0;

    Object.keys(targetPoints).forEach(sub => {
      const targetVal = targetPoints[sub];
      const count = studyLogs.filter(l => l.date === date && l.subject === sub).length;
      dayPt += count;

      const key = keys[sub];
      document.getElementById(`val-${key}`).innerText = count;
      const pct = Math.min(100, Math.round((count / targetVal) * 100));
      document.getElementById(`bar-${key}`).style.width = `${pct}%`;
    });

    document.getElementById('hero-pt').innerText = dayPt;

    const totalPt = studyLogs.length;
    let rank = "早稲田の挑戦者";
    if (totalPt >= 10) rank = "鍛錬の浪人";
    if (totalPt >= 30) rank = "早稲田の鬼";
    if (totalPt >= 80) rank = "キャンパスの覇者";
    document.getElementById('user-rank').innerText = `RANK: ${rank}`;
  }

  function renderBadges() {
    const totalPt = studyLogs.length;
    const container = document.getElementById('badge-container');
    container.innerHTML = '';

    badgesMaster.forEach(b => {
      const isUnlocked = totalPt >= b.req;
      container.innerHTML += `
        <div class="badge-item ${isUnlocked ? 'unlocked' : ''}">
          <span class="badge-icon">${b.icon}</span>
          <div class="badge-name">${b.name}</div>
          <div class="badge-req">${b.req}ptで解放</div>
        </div>
      `;
    });
  }

  /* グラフ初期化 */
  function initCharts() {
    // 1. 全科目 円グラフ
    const ctxPie1 = document.getElementById('subjectPieChart').getContext('2d');
    subjectPieChart = new Chart(ctxPie1, {
      type: 'doughnut',
      data: {
        labels: ['英語', '国語', '日本史', 'その他'],
        datasets: [{
          data: [0, 0, 0, 0],
          backgroundColor: ['#d47a82', '#d4a373', '#81b29a', '#8d99ae'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }
      }
    });

    // 2. 国語グループ内訳 円グラフ
    const ctxPie2 = document.getElementById('japanesePieChart').getContext('2d');
    japanesePieChart = new Chart(ctxPie2, {
      type: 'doughnut',
      data: {
        labels: ['現代文', '古文', '漢文'],
        datasets: [{
          data: [0, 0, 0],
          backgroundColor: ['#e07a5f', '#f4a261', '#e9c46a'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }
      }
    });

    // 3. 積み上げ推移 棒グラフ
    const ctxBar = document.getElementById('stackedBarChart').getContext('2d');
    stackedBarChart = new Chart(ctxBar, {
      type: 'bar',
      data: {
        labels: [],
        datasets: [
          { label: '英語', data: [], backgroundColor: '#d47a82' },
          { label: '国語', data: [], backgroundColor: '#d4a373' },
          { label: '日本史', data: [], backgroundColor: '#81b29a' },
          { label: 'その他', data: [], backgroundColor: '#8d99ae' }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { stacked: true, ticks: { color: '#d1c4c6' }, grid: { display: false } },
          y: { stacked: true, ticks: { color: '#d1c4c6' }, beginAtZero: true }
        },
        plugins: { legend: { display: false } }
      }
    });
  }

  function updateCharts() {
    const date = document.getElementById('task-date').value;
    const todayLogs = studyLogs.filter(l => l.date === date);

    // 科目別カウント
    const engCount = todayLogs.filter(l => l.subject === '英語').length;
    const japCount = todayLogs.filter(l => l.subject === '国語').length;
    const hisCount = todayLogs.filter(l => l.subject === '日本史').length;
    const othCount = todayLogs.filter(l => l.subject === 'その他').length;

    subjectPieChart.data.datasets[0].data = [engCount, japCount, hisCount, othCount];
    subjectPieChart.update();

    // 国語内訳カウント
    const genCount = todayLogs.filter(l => l.subject === '国語' && l.subSubject === '現代文').length;
    const kobCount = todayLogs.filter(l => l.subject === '国語' && l.subSubject === '古文').length;
    const kanCount = todayLogs.filter(l => l.subject === '国語' && l.subSubject === '漢文').length;

    japanesePieChart.data.datasets[0].data = [genCount, kobCount, kanCount];
    japanesePieChart.update();

    // 積み上げ推移グラフ更新
    const dates = [...new Set(studyLogs.map(l => l.date))].sort();
    
    stackedBarChart.data.labels = dates.map(d => d.substring(5));
    stackedBarChart.data.datasets[0].data = dates.map(d => studyLogs.filter(l => l.date === d && l.subject === '英語').length);
    stackedBarChart.data.datasets[1].data = dates.map(d => studyLogs.filter(l => l.date === d && l.subject === '国語').length);
    stackedBarChart.data.datasets[2].data = dates.map(d => studyLogs.filter(l => l.date === d && l.subject === '日本史').length);
    stackedBarChart.data.datasets[3].data = dates.map(d => studyLogs.filter(l => l.date === d && l.subject === 'その他').length);
    stackedBarChart.update();
  }

  function saveKey() {
    localStorage.setItem('waseda_api_key', document.getElementById('api-key').value);
  }

  function clearAllData() {
    if (confirm('すべてのデータを完全に消去しますか？')) {
      studyLogs = [];
      renderLogs();
      updateProgress();
      renderBadges();
      alert('初期化されました。');
    }
  }

  window.onload = init;
</script>

</body>
</html>
