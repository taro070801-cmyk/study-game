<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>早稲田攻略 AIパートナー & 学習ログ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-base: #eef2ed;
      --card-bg: #f7f9f6;
      --text-main: #2d3732;
      --text-sub: #52635a;
      --primary: #3b604e;
      --accent-ocean: #4a7c59;
      --border-color: #d1dad3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    header {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 { font-size: 1.4rem; color: var(--primary); }

    .status-badge {
      background: #e2ebd9;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .api-key-box {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #e2ebd9;
      border-radius: 8px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--primary);
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-color);
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 10px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    textarea { resize: vertical; height: 100px; }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background-color: var(--accent-ocean); }
    button:disabled { background-color: #a0b2a6; cursor: not-allowed; }

    .chart-container { position: relative; height: 260px; width: 100%; }

    .report-output {
      margin-top: 15px;
      background: #ffffff;
      border-left: 4px solid var(--primary);
      padding: 15px;
      border-radius: 0 8px 8px 0;
      white-space: pre-wrap;
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.7;
      min-height: 150px;
      max-height: 500px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>早稲田合格戦略ダッシュボード (Gemini AI連携版)</h1>
      <p style="font-size: 0.85rem; color: var(--text-sub);">自然派アースカラーデザイン / リアルタイムGemini API接続</p>
    </div>
    <div class="status-badge" id="user-status">
      累計ポイント: 12,400 XP | 現在の標高: 1,240m
    </div>
    
    <!-- APIキー入力エリア -->
    <div class="api-key-box">
      <label for="api-key" style="margin:0;">Google Gemini API Key を入力:</label>
      <input type="password" id="api-key" placeholder="AIzaSy..." style="margin-top:4px;">
    </div>
  </header>

  <div class="main-grid">
    <!-- 学習入力 & AIトレーナー連携 -->
    <div class="card">
      <h2>1. 今日の勉強ログ & 悩み・問いかけ</h2>
      <form id="study-form">
        <label for="subject">科目・対象</label>
        <select id="subject">
          <option value="英語（長文読解・文脈把握）">英語（長文読解・文脈把握）</option>
          <option value="英語（英作文・文法・語法）">英語（英作文・文法・語法）</option>
          <option value="日本史（時代背景・論理展開）">日本史（時代背景・論理展開）</option>
          <option value="国語（現代文・論理的読解）">国語（現代文・論理的読解）</option>
          <option value="国語（古文・漢文）">国語（古文・漢文）</option>
        </select>

        <label for="study-time">学習時間（分）</label>
        <input type="number" id="study-time" value="90" min="10" step="10">

        <label for="user-reflection">相談・振返り・疑問（自由に入力）</label>
        <textarea id="user-reflection" placeholder="例: 早稲田の英語でパラグラフごとの論理転換を見落として失点した。単なる和訳にとどまらない対策や、自分が見落としている視点を教えてほしい。"></textarea>

        <button type="button" id="submit-btn" onclick="processAnalysisWithGemini()">Geminiパートナーにリアルタイム分析を依頼</button>
      </form>
    </div>

    <!-- 累積ポイントグラフ -->
    <div class="card">
      <h2>2. 継続の積み上げ（累積XP成長グラフ）</h2>
      <div class="chart-container">
        <canvas id="growthChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Geminiからの動的リアルタイム回答 -->
  <div class="card">
    <h2>3. 専属AIパートナーからのリアルタイム分析レポート</h2>
    <div id="report-container" class="report-output">
APIキーを入力し、メッセージを入力してボタンを押すと、Geminiがリアルタイムであなた専用のアドバイスと深層分析を生成します。
    </div>
  </div>
</div>

<script>
  // 初期データ（成長グラフ）
  const labels = ['8/21', '8/22', '8/23', '8/24', '8/25', '8/26', '今日'];
  const xpData = [10500, 10900, 11200, 11500, 11900, 12400];

  const ctx = document.getElementById('growthChart').getContext('2d');
  const growthChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels.slice(0, 6),
      datasets: [{
        label: '累計獲得ポイント (XP)',
        data: xpData,
        borderColor: '#3b604e',
        backgroundColor: 'rgba(59, 96, 78, 0.1)',
        fill: true,
        tension: 0.3,
        pointBackgroundColor: '#2c5282',
        pointRadius: 5
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: false, grid: { color: '#e0e6e1' }, ticks: { color: '#52635a' } },
        x: { grid: { display: false }, ticks: { color: '#52635a' } }
      }
    }
  });

  // Gemini APIに直接リクエストを送信する関数
  async function processAnalysisWithGemini() {
    const apiKey = document.getElementById('api-key').value.trim();
    const reportBox = document.getElementById('report-container');
    const submitBtn = document.getElementById('submit-btn');

    if (!apiKey) {
      alert("Google Gemini API Key を入力してください。");
      return;
    }

    const subject = document.getElementById('subject').value;
    const minutes = parseInt(document.getElementById('study-time').value) || 0;
    const reflection = document.getElementById('user-reflection').value;

    if (!reflection) {
      alert("相談・振返り・疑問を入力してください。");
      return;
    }

    // UIをローディング状態に変更
    submitBtn.disabled = true;
    submitBtn.innerText = "Geminiが思考・分析中...";
    reportBox.innerText = "Geminiが早稲田の傾向と入力された内容を照合し、多角的な視点を構築しています...";

    // システムプロンプト（AIに専属エリートトレーナーの役割を与える指令）
    const systemInstruction = `
あなたは早稲田大学受験に特化した、超優秀で厳しくも温かい専属のAIパートナー・トレーナーです。
浪人生・受験生に対して、単なる慰めや表面的な壁打ちはせず、「受かるための思考の深さ」「受験生自身が気づいていない多角的な視点・盲点」「出題者の意図」を突くアドバイスを提供してください。

【出力フォーマット】
以下の構成で簡潔かつ明瞭に回答してください：
■ 学習傾向 & 弱点の深層分析
（表面的な失敗の理由ではなく、思考プロセスのどこで踏み外したかを指摘）

■ エリートパートナーの多面的アプローチ（自分にない視点）
（和訳依存からの脱却、出題者側のトラップ構造、逆説的思考など、受験生の視点を一段引き上げるアドバイス）

■ 明日への具体的改善アクション
（明日すぐに実践できる具体的な行動方針）
    `;

    const userPrompt = `
【学習科目】: ${subject}
【学習時間】: ${minutes}分
【本人の振返り・悩み・疑問】:
${reflection}
    `;

    try {
      // Gemini 2.5 Flash API呼び出し
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: systemInstruction + "\n\n" + userPrompt }
            ]
          }]
        })
      });

      const data = await response.json();

      if (data.candidates && data.candidates[0].content.parts[0].text) {
        const aiResponse = data.candidates[0].content.parts[0].text;
        
        // ポイント加算とグラフの動的更新
        const gainedXp = minutes * 2 + 100;
        const currentXp = xpData[xpData.length - 1] + gainedXp;
        growthChart.data.labels = labels;
        growthChart.data.datasets[0].data.push(currentXp);
        growthChart.update();

        document.getElementById('user-status').innerText = 
          `累計ポイント: ${currentXp.toLocaleString()} XP | 現在の標高: ${(currentXp / 10).toFixed(0)}m`;

        // レポート表示
        reportBox.innerText = `【獲得XP: +${gainedXp} pt】\n\n` + aiResponse;
      } else {
        reportBox.innerText = "エラー: APIからのレスポンスを解析できませんでした。APIキーを確認してください。";
      }

    } catch (error) {
      console.error(error);
      reportBox.innerText = "通信エラーが発生しました。APIキーまたはネットワーク接続を確認してください。";
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Geminiパートナーにリアルタイム分析を依頼";
    }
  }
</script>

</body>
</html>
